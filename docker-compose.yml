services:
  db:
    image: mysql:8.0
    container_name: lims_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: lims_redis
    restart: always
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: lims_chromadb
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  web:
    build: .
    container_name: lims_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - chromadb

  celery:
    build: .
    container_name: lims_celery
    command: celery -A lims_project worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - chromadb

volumes:
  mysql_data:
  chromadb_data:
