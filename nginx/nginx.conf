upstream lims_web {
    server web:8000;
}

server {
    listen 80;
    server_name vietnhatlims.local vietnhatlims.com VietNhatLiMS;

    location / {
        proxy_pass http://lims_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Cấu hình kích thước upload tối đa (nếu ứng dụng cho phép upload file lớn)
    client_max_body_size 50M;
}
