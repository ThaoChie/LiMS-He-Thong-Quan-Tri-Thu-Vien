{% extends 'base.html' %}

{% block title %}Đổi Mật Khẩu | VietNhatLiMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h4 class="mb-0 text-primary"><i class="bi bi-shield-lock me-2"></i>Đổi Mật Khẩu</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Xác nhận đổi mật khẩu</button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại hồ sơ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
