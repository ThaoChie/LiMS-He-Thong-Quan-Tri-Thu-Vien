{% extends 'base.html' %}

{% block title %}Thêm người dùng | VietNhatLiMS{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="text-primary"><i class="bi bi-person-plus me-2"></i>Thêm người dùng mới</h2>
    </div>
    <div class="col-auto">
        <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Quay lại
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
