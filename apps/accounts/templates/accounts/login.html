{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - LiMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <h3>LiMS</h3>
            <p>Hệ thống Quản lý Thư viện</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2">
            <i class="bi bi-exclamation-triangle me-1"></i> Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label">Mật khẩu</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
            </button>
        </form>
        <div class="text-center text-muted" style="font-size:0.82rem;">
            <i class="bi bi-shield-lock me-1"></i> Liên hệ thủ thư hoặc quản trị viên để được cấp tài khoản.
        </div>
    </div>
</div>
</body>
</html>
